version: "1.0.0"
categories:
  - off-by-one
  - state-machine-bypass
  - race-condition
  - deadlock
  - context-cancellation
  - error-masking
  - resource-leak
  - integer-overflow
  - config-precedence
  - serialization-loss
  - metric-skew
  - cycle-detection
defects:
  - id: "DEFECT-001"
    category: "off-by-one"
    component: "pkg/core"
    target_file: "pkg/core/template_macro.go"
    difficulty: "EASY"
    symptom: "End of string slice truncates the last character when substring length equals remaining string slice length."
  - id: "DEFECT-002"
    category: "off-by-one"
    component: "pkg/cache"
    target_file: "pkg/cache/cache.go"
    difficulty: "EASY"
    symptom: "Cache capacity off-by-one causes eviction when current size equals capacity - 1 instead of capacity."
  - id: "DEFECT-003"
    category: "off-by-one"
    component: "pkg/scheduler"
    target_file: "pkg/scheduler/fair_queue_quota.go"
    difficulty: "MEDIUM"
    symptom: "MaxQueuedRuns quota check rejects queue requests when queued count is strictly less than MaxQueuedRuns instead of equal."
  - id: "DEFECT-004"
    category: "state-machine-bypass"
    component: "pkg/statemachine"
    target_file: "pkg/statemachine/state.go"
    difficulty: "MEDIUM"
    symptom: "Direct transition from RunStatePending to RunStateCompleted bypasses validation check."
  - id: "DEFECT-005"
    category: "state-machine-bypass"
    component: "pkg/statemachine"
    target_file: "pkg/statemachine/step_state.go"
    difficulty: "MEDIUM"
    symptom: "Terminal StepStateFailed transition allows re-transitioning into StepStateRunning."
  - id: "DEFECT-006"
    category: "race-condition"
    component: "pkg/storage/memory"
    target_file: "pkg/storage/memory/queue.go"
    difficulty: "HARD"
    symptom: "Task queue Ack operation modifies in-flight map without holding the write lock."
  - id: "DEFECT-007"
    category: "race-condition"
    component: "pkg/worker"
    target_file: "pkg/worker/priority_worker.go"
    difficulty: "MEDIUM"
    symptom: "Worker steal statistics counter incremented concurrently without lock acquisition."
  - id: "DEFECT-008"
    category: "deadlock"
    component: "pkg/scheduler"
    target_file: "pkg/scheduler/throttler.go"
    difficulty: "HARD"
    symptom: "Inverted lock acquisition order between tenant rate limiter and concurrency governor causing deadlock."
  - id: "DEFECT-009"
    category: "deadlock"
    component: "pkg/storage/memory"
    target_file: "pkg/storage/memory/transaction.go"
    difficulty: "HARD"
    symptom: "Nested snapshot lock acquisition order mismatch during concurrent commit and rollback operations."
  - id: "DEFECT-010"
    category: "context-cancellation"
    component: "pkg/worker"
    target_file: "pkg/worker/deadline.go"
    difficulty: "MEDIUM"
    symptom: "Task timer cancels background parent context rather than derived step context on timeout."
  - id: "DEFECT-011"
    category: "context-cancellation"
    component: "pkg/api/http"
    target_file: "pkg/api/http/middleware.go"
    difficulty: "MEDIUM"
    symptom: "Request timeout middleware neglects to propagate parent cancellation when client disconnects."
  - id: "DEFECT-012"
    category: "error-masking"
    component: "pkg/storage/postgres"
    target_file: "pkg/storage/postgres/circuit.go"
    difficulty: "EASY"
    symptom: "Circuit breaker swallows underlying database connection error and returns generic nil."
  - id: "DEFECT-013"
    category: "error-masking"
    component: "pkg/core"
    target_file: "pkg/core/macro_eval.go"
    difficulty: "EASY"
    symptom: "Division by zero returns 0 without propagating error to caller."
  - id: "DEFECT-014"
    category: "resource-leak"
    component: "pkg/events"
    target_file: "pkg/events/dedup.go"
    difficulty: "MEDIUM"
    symptom: "Garbage collection ticker in event deduplicator is never stopped on Close()."
  - id: "DEFECT-015"
    category: "resource-leak"
    component: "pkg/storage/postgres"
    target_file: "pkg/storage/postgres/pool.go"
    difficulty: "MEDIUM"
    symptom: "Pool monitor health probe goroutine leaks when pool is closed because stop channel is ignored."
  - id: "DEFECT-016"
    category: "integer-overflow"
    component: "pkg/core"
    target_file: "pkg/core/rate_limiter.go"
    difficulty: "MEDIUM"
    symptom: "Nanosecond calculation converts float64 burst capacity to int32 resulting in overflow truncation."
  - id: "DEFECT-017"
    category: "integer-overflow"
    component: "pkg/metrics"
    target_file: "pkg/metrics/histogram.go"
    difficulty: "MEDIUM"
    symptom: "Percentile quantile bucket calculation overflows uint32 index on high sample counts."
  - id: "DEFECT-018"
    category: "config-precedence"
    component: "pkg/config"
    target_file: "pkg/config/config.go"
    difficulty: "MEDIUM"
    symptom: "Environment variable value overrides explicit CLI flag value in 4-tier configuration loader."
  - id: "DEFECT-019"
    category: "config-precedence"
    component: "pkg/config"
    target_file: "pkg/config/merger.go"
    difficulty: "MEDIUM"
    symptom: "DeepMerge ignores nested base config keys when override has partial nested map."
  - id: "DEFECT-020"
    category: "serialization-loss"
    component: "pkg/events"
    target_file: "pkg/events/serialization_advanced.go"
    difficulty: "EASY"
    symptom: "CloudEvents serializer drops Subject attribute during JSON marshaling."
  - id: "DEFECT-021"
    category: "serialization-loss"
    component: "pkg/api/grpc"
    target_file: "pkg/api/grpc/codec.go"
    difficulty: "HARD"
    symptom: "Varint buffer codec truncates binary payload when buffer boundary aligns with field tag."
  - id: "DEFECT-022"
    category: "metric-skew"
    component: "pkg/metrics"
    target_file: "pkg/metrics/otel.go"
    difficulty: "EASY"
    symptom: "Span duration calculated as start minus end instead of end minus start resulting in negative duration."
  - id: "DEFECT-023"
    category: "metric-skew"
    component: "pkg/scheduler"
    target_file: "pkg/scheduler/priority_queue_metrics.go"
    difficulty: "MEDIUM"
    symptom: "Queue high watermark metric recorded before item push, causing undercount of peak depth."
  - id: "DEFECT-024"
    category: "cycle-detection"
    component: "pkg/core"
    target_file: "pkg/core/cycle_tarjan.go"
    difficulty: "MEDIUM"
    symptom: "Self-loop edge (node depending on itself) bypassed when checking strongly connected component size."
  - id: "DEFECT-025"
    category: "cycle-detection"
    component: "pkg/core"
    target_file: "pkg/core/dag.go"
    difficulty: "HARD"
    symptom: "Topological sort fails to report cycle error if graph contains disconnected circular subcomponent."
